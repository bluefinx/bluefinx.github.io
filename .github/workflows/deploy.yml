## Code copied and customised from Vite Dev Guide at https://vite.dev/guide/static-deploy (01 May 2026)

name: Deploy Vite React project to GitHub Pages

on:
  # Runs on pushes targeting the source branch
  push:
    branches: ['source']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Update licenses.txt
        run: |
          npx license-checker --production --json \
          | jq 'to_entries
            | map(select(.value.licenses != "UNLICENSED"))
            | map(
                .key as $pkg |
                {
                  name: ($pkg | sub("@[^@]+$"; "")),
                  version: ($pkg | capture("@(?<v>[^@]+)$").v),
                  license: .value.licenses,
                  repository: .value.repository
                }
              )' > public/licenses.txt
      - name: Commit licenses.txt if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/licenses.txt
          git diff --staged --quiet || (git commit -m "chore: update licenses.txt" && git push)
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5